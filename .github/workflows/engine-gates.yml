name: Engine Gates

# 公共引擎门（票 34 门禁减肥）：引擎门 verify-ticket-02.mjs（36 例）
# + 误检 harness misdetect-repro-v2.mjs（25 例）。原 verify-13/16/18 三处逐字重复
# 各跑一遍，抽到本 workflow 统一跑一次（票级 verify-* 只保留各自专属断言）。
# 触发面对齐 CI 门禁定义：pull_request + push(main, cch/**)（见 CONTEXT.md）。
# 返工联①（票 34 R1）：node 20→22 —— 装载脚本需 module.stripTypeScriptTypes（Node>=22.13）。
# Cycle-7 T-07（D-010）：新增勾销对账门 issue-checkbox-audit.mjs（票据勾销标记 × 报告完成自述；unknown 不得合并为 pass）。

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'cch/**'

permissions:
  contents: read

jobs:
  engine-gates:
    name: Engine gate (36) + harness (25)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Engine gate (verify-ticket-02.mjs)
        run: node tests/scripts/verify-ticket-02.mjs
      - name: Harness (misdetect-repro-v2.mjs)
        run: node tests/scripts/misdetect-repro-v2.mjs
      - name: Issue checkbox audit (issue-checkbox-audit.mjs)
        run: node tests/scripts/issue-checkbox-audit.mjs

      # Cycle-8 T-01 / D-004①：清理脚本白名单自检 —— 证明清理只可能触碰受管区的 draft 子区
      # （硬白名单 + 越权穿越拒绝 + dry-run 纯度 + 区界文档保护）。
      - name: Draft cleanup whitelist self-test (scratch-draft-clean.mjs --self-test)
        run: node tests/scripts/scratch-draft-clean.mjs --self-test
