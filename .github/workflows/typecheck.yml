name: Typecheck

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - 'cch/**'

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Line-ending guard (CRLF in tracked text)
        run: |
          bad=$(git ls-files | grep -vE '\.(bat|ps1|cmd|png|ico|icns|jpg|jpeg|gif|webp|exe|dll|node|pdb|msi|so|dylib|bin|zip|gz|tar|7z)$' | xargs -r grep -lU "$(printf '\r')" 2>/dev/null || true)
          if [ -n "$bad" ]; then echo "::error::CRLF found in tracked text files: $bad"; exit 1; fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # 联③（票 34 R1）：回迁 npm ci（cch-23 同基线先例）——lockfile 由 lockfile-regen workflow 以
      # package.json（票 25 钉死版）为真相源再生（联②），失同步已修复；legacy-peer-deps 走内联
      # （.npmrc 集中口径为票 31 D-31a 产物，未合流前本分支不可见，Delta「或等效」出口）。
      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck
