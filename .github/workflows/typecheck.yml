name: Typecheck

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - 'cch/**'

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Line-ending guard (CRLF in tracked text)
        run: |
          bad=$(git ls-files | grep -vE '\.(bat|ps1|cmd|png|ico|icns|jpg|jpeg|gif|webp|exe|dll|node|pdb|msi|so|dylib|bin|zip|gz|tar|7z)$' | xargs -r grep -lU "$(printf '\r')" 2>/dev/null || true)
          if [ -n "$bad" ]; then echo "::error::CRLF found in tracked text files: $bad"; exit 1; fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # 安装面：依赖钉显式 semver 范围 + npm ci 复现（package-lock.json）。票 43（A-021）根修后
      # React 18 / React 19 分居两个 install root，peer 各自自洽，安装面无需 peer 例外开关。
      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Cycle-8 T-03 / D-005④：防误吞门禁 —— 断言关键路径不被 .gitignore 吞掉。
      # 关键路径清单只存在于脚本内：本文件不出现受管工件区路径字面量，
      # 否则会击穿 verify-ticket-07/10/11 的反向断言门（workflow 不得引用受管区路径）。
      - name: Ignore-swallow guard (key paths must not be gitignored)
        run: node tests/scripts/check-ignore-guard.mjs

      # retro 2026-10-26：悬空指针门 —— 代理阅读文档（AGENTS.md / docs/agents/*.md 等）
      # 里的仓库相对路径必须真实存在。人工清过一轮同类问题，这次落成门。
      - name: Doc reference guard (dangling path refs)
        run: node tests/scripts/check-doc-refs.mjs
