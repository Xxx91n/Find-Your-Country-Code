# 票 28 验证 workflow：本票验收门（verify-ticket-28.mjs —— A-002 正例入账 / L3 常量口径 /
# 护栏1「国家选择器 ≠ 区号字段」抑制 / 护栏2 共享区号不回退 / pseudo 口径同步 / 全语料回归）。
# 触发：pull_request（ADR-0006 非发版 workflow PR 门控）+ 本票分支 push + 手动 dispatch。
# node 钉 22：装载器用 module.stripTypeScriptTypes（>=22.13），无 npm 依赖安装面
#   —— 与 verify-31 同口径，规避仓库级 npm install ERESOLVE 破窗（票 28 报告 D-28a）。
name: Verify Ticket 28 (iso2-dial-evidence)

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - 'cch/28-iso2-dial-evidence'

permissions:
  contents: read

jobs:
  ticket-28-gate:
    name: Ticket-28 gate (A-002 paren-dial evidence + guardrails)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Ticket-28 acceptance gate
        run: node tests/scripts/verify-ticket-28.mjs
