name: Verify Ticket 12 (rules override cap enforcement point + BC stub fidelity)

# 票 12（Cycle-6 · A-036）门：上限强制点裁定落地 / 断言未放宽 / BC 替身克隆保真度 / origin 同源。
# 含一次行为锁（实跑票 05 单元门，断言面零改动）；node 钉 22、无 npm 依赖、无浏览器、零外网。
# 触发：pull_request（ADR-0006 决策 2 非发版 workflow PR 门控）+ 本票分支 push + 手动 dispatch。
on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - 'cch/12-rules-limit-fidelity'

permissions:
  contents: read

jobs:
  ticket-12-gate:
    name: Ticket-12 gate (rules override cap enforcement point A-036)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Ticket-12 acceptance gate
        run: node tests/scripts/verify-ticket-12.mjs
