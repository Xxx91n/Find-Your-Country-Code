name: Corpus drift (advisory, weekly)

# 形态漂移探测——正式模式（票 T6 / issue #15；spec #9 Q4/Q7）
#
# 原型票（T5 / issue #14）连续两次绿后转常：
#   · 触发面 = schedule（每周一次）+ workflow_dispatch；**永不进 pull_request**。
#   · tier=minor/major 时自动开 needs-triage issue（正文含报告摘录与结构 diff
#     输出；同一源按正文 marker 去重，后续漂移以评论追加）；none/patch 不开。
#   · 红灯 = 告警：schedule 运行不带 --strict，漂移不阻断运行；告警由 issue 承载。
#
# 红线（spec #9 Q7）：
#   · 本 workflow 永不出现在 pull_request 触发面（advisory：失败天然不阻断 PR）。
#   · **没有任何写回 skeleton / manifest / 镜像页的 step**——编排器把新骨架
#     `--out` 到仓库外 archive，报告只落 live-out/；06-manifest / 镜像页更新
#     永远是人工归因后的显式动作。唯一写动作是开 issue（issues: write），
#     仓库内容只读（contents: read）。
#   · 归因与 bump 永远人工：先归因（真实改版 / 抓取环境差异 / 归一化缺陷）再决定，
#     绝不自动写回任何基线。
#   · 采集只做匿名 GET + 渲染；不登录、不提交表单、不抓 UA 伪造。
#   · 有头 Chrome + xvfb：复用真实站点冒烟层（real-site-smoke.yml）已验证的
#     启动口径——headless shell 常被反爬挑战拦截，有头完整 Chrome 可正常渲染。
on:
  workflow_dispatch:
    inputs:
      strict:
        description: '手动触发时把 minor/major 漂移也判红（schedule 不带；默认 false）'
        type: boolean
        default: false
  schedule:
    # 每周一 04:00 UTC（低频 advisory；与 real-site-smoke 的 03:00 错开）
    - cron: '0 4 * * 1'

permissions:
  contents: read
  issues: write

# 周排期与手动触发可能重叠：同一并发组串行化，避免两次运行同时读到「无同类
# issue」后各自开票（去重是读后写，必须串行）。不取消进行中的运行。
concurrency:
  group: corpus-drift
  cancel-in-progress: false

jobs:
  corpus-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Line-ending guard (CRLF in tracked text)
        run: |
          bad=$(git ls-files | grep -vE '\.(bat|ps1|cmd|png|ico|icns|jpg|jpeg|gif|webp|exe|dll|node|pdb|msi|so|dylib|bin|zip|gz|tar|7z)$' | xargs -r grep -lU "$(printf '\r')" 2>/dev/null || true)
          if [ -n "$bad" ]; then echo "::error::CRLF found in tracked text files: $bad"; exit 1; fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # 有头浏览器需要虚拟显示（同 real-site-smoke.yml）。
      - name: Ensure xvfb (headed browser virtual display)
        run: command -v xvfb-run || (sudo apt-get update && sudo apt-get install -y xvfb)

      # archive 根锚定在 workspace 的兄弟目录（与本地默认 D:/…-evidence-archive 同构）：
      # 06-capture-forms 的仓外护栏拒绝把原始快照写进仓库内。
      - name: Run corpus drift (capture → skeleton → structural diff)
        env:
          CCH_ARCHIVE_ROOT: ${{ github.workspace }}/../choose-your-country-evidence-archive
        run: |
          strict=""
          if [ "${{ inputs.strict }}" = "true" ]; then strict="--strict"; fi
          xvfb-run -a node tests/scripts/06-corpus-drift.mjs --out live-out/corpus-drift $strict

      # 告警投递：只开 / 更新 issue（唯一写动作）。载荷由编排器产出（只含
      # minor/major）；none/patch 时载荷为空，本步如实报「无漂移」。
      # if: always() —— 契约违规（exit 1）或 strict 判红时，漂移告警仍要送达。
      - name: Open or update drift issues (minor/major only)
        if: ${{ always() && hashFiles('live-out/corpus-drift/drift-issues.json') != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          node tests/scripts/06-drift-issue.mjs \
            --issues live-out/corpus-drift/drift-issues.json \
            --out live-out/corpus-drift/drift-issue-outcome.json

      - name: Summary
        if: always()
        run: |
          {
            echo '## corpus-drift（advisory 正式模式，票 T6 / issue #15）'
            echo ''
            echo '- 触发面: schedule（每周一 04:00 UTC）+ workflow_dispatch；无 pull_request'
            echo '- 写回: 仓库无写回（新骨架 --out 到仓外 archive；报告只进 live-out/）；唯一写动作 = 漂移 issue'
            echo '- 降级登记: tests/corpus/forms/drift-degradations.json（reason + ticket 硬校验）'
            echo '- 告警策略: tier=minor/major 开 needs-triage issue；none/patch 不开、不写回基线'
            echo ''
            if [ -f live-out/corpus-drift/drift-summary.json ]; then
              node -e "const j=require('./live-out/corpus-drift/drift-summary.json');console.log('- 契约: '+(j.contract.ok?'OK':'VIOLATION ×'+j.contract.violations.length));console.log('- 计数: '+JSON.stringify(j.counts));console.log('- 正式采集集: '+(j.official_set.join(', ')||'（空）'));for(const r of j.matrix)console.log('- '+r.id+' ['+r.reachability+'] drift='+r.drift.tier+' → '+r.decision);for(const a of (j.drift_alerts||[]))console.log('- 告警: '+a.id+' '+a.tier+'（自动开 issue）');for(const v of j.contract.violations)console.log('::error::'+v);"
            else
              echo '- 报告未产出；见 job log'
            fi
            if [ -f live-out/corpus-drift/drift-issue-outcome.json ]; then
              node -e "const j=require('./live-out/corpus-drift/drift-issue-outcome.json');console.log('- issue 投递: detected='+j.counts.detected+' created='+j.counts.create+' commented='+j.counts.comment+' failed='+j.counts.failed);for(const a of j.actions)console.log('  - '+a.id+' '+a.action+(a.number?' #'+a.number:'')+(a.ok?' '+a.url:' FAILED '+a.error));"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload drift report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: corpus-drift
          path: live-out/corpus-drift/
          if-no-files-found: warn
