name: Auto Release on Script Update

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'vite.config.ts'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: write

jobs:
  # ══ 发布门（Cycle-6 票 07 / A-029；决策依据 ADR-0010 条款 2） ══
  # 真实站点层最近一次运行必须为绿，或该失败已被**显式 ack 并立票**，否则不出包。
  # 二者必居其一，不得静默绕过 —— 门以 needs 硬依赖挂在 release job 之前（门不过则 release 不运行）。
  # 门逻辑落 tests/scripts/release-gate.mjs（ADR-0006 决策 1：CI 引用脚本住 tests/scripts/，
  # workflows 禁止引用调研现场路径）。
  # 注：发布门属发版系 workflow 的例外路径，不改变 ADR-0006 条款 2 的 PR 门控语义；
  #     也不重开 ADR-0008 第二层（真实站点层仍不进 pull_request、失败仍只告警）。
  release-gate:
    name: Release gate (real-site layer green or explicitly acked)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Real-site layer release gate (green, or explicit ack + ticket)
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tests/scripts/release-gate.mjs

  release:
    needs: release-gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build userscript
        run: npm run build

      - name: Extract version from build artifact
        id: extract_version
        run: |
          VERSION=$(grep -m1 '// @version' dist/find-your-country-code.user.js | awk '{print $NF}' | tr -d '\r')
          if [ -z "$VERSION" ]; then
            echo "::error::@version not found in dist/find-your-country-code.user.js"
            exit 1
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "TAG=v$VERSION" >> $GITHUB_OUTPUT

      - name: Check if tag already exists
        id: check_tag
        run: |
          if git ls-remote --tags origin "refs/tags/v${{ steps.extract_version.outputs.VERSION }}" | grep -q .; then
            echo "EXISTS=true" >> $GITHUB_OUTPUT
          else
            echo "EXISTS=false" >> $GITHUB_OUTPUT
          fi

      - name: Read changelog (Chinese)
        if: steps.check_tag.outputs.EXISTS == 'false'
        id: changelog_cn
        run: |
          {
            echo 'CONTENT<<__EOF__'
            cat greasyfork/Glog.md
            echo '__EOF__'
          } >> $GITHUB_OUTPUT

      - name: Read changelog (English)
        if: steps.check_tag.outputs.EXISTS == 'false'
        id: changelog_en
        run: |
          {
            echo 'CONTENT<<__EOF__'
            cat greasyfork/Glog_EN.md
            echo '__EOF__'
          } >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        if: steps.check_tag.outputs.EXISTS == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.extract_version.outputs.TAG }}
          name: ${{ steps.extract_version.outputs.TAG }}
          body: |
            ${{ steps.changelog_cn.outputs.CONTENT }}

            ---

            ${{ steps.changelog_en.outputs.CONTENT }}
          files: dist/find-your-country-code.user.js
