name: Auto Release on Script Update

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'vite.config.ts'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build userscript
        run: npm run build

      - name: Extract version from build artifact
        id: extract_version
        run: |
          VERSION=$(grep -m1 '// @version' dist/find-your-country-code.user.js | awk '{print $NF}' | tr -d '\r')
          if [ -z "$VERSION" ]; then
            echo "::error::@version not found in dist/find-your-country-code.user.js"
            exit 1
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "TAG=v$VERSION" >> $GITHUB_OUTPUT

      - name: Check if tag already exists
        id: check_tag
        run: |
          if git ls-remote --tags origin "refs/tags/v${{ steps.extract_version.outputs.VERSION }}" | grep -q .; then
            echo "EXISTS=true" >> $GITHUB_OUTPUT
          else
            echo "EXISTS=false" >> $GITHUB_OUTPUT
          fi

      - name: Read changelog (Chinese)
        if: steps.check_tag.outputs.EXISTS == 'false'
        id: changelog_cn
        run: |
          {
            echo 'CONTENT<<__EOF__'
            cat greasyfork/Glog.md
            echo '__EOF__'
          } >> $GITHUB_OUTPUT

      - name: Read changelog (English)
        if: steps.check_tag.outputs.EXISTS == 'false'
        id: changelog_en
        run: |
          {
            echo 'CONTENT<<__EOF__'
            cat greasyfork/Glog_EN.md
            echo '__EOF__'
          } >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        if: steps.check_tag.outputs.EXISTS == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.extract_version.outputs.TAG }}
          name: ${{ steps.extract_version.outputs.TAG }}
          body: |
            ${{ steps.changelog_cn.outputs.CONTENT }}

            ---

            ${{ steps.changelog_en.outputs.CONTENT }}
          files: dist/find-your-country-code.user.js
