# 票 06（Cycle-6 · A-030）形态语料三层架构结构门
# 触发：pull_request（ADR-0006 非发版 workflow PR 门控）+ 本票分支 push + 手动 dispatch。
# 纯文本结构断言（指纹 / 合规 / 目录纪律 / 确定性），无 npm 依赖安装面、无网络。
# 注：归档实物指纹复核在无 archive 的 CI 上按 WORKFLOW §8.2 显式跳过（不伪造绿）。
name: Verify Ticket 06 (form corpus)

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - 'cch/06-form-corpus'

permissions:
  contents: read

jobs:
  ticket-06-gate:
    name: Ticket-06 gate (form corpus A-030)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Ticket-06 acceptance gate
        run: node tests/scripts/verify-ticket-06.mjs
