name: Calibration Baseline

on:
  workflow_dispatch:
  push:
    branches:
      - 'cch/14-calibration-corpus'

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # harness 为零依赖 node 脚本（函数束装载引擎，零构建），无需 npm ci
      - name: Run precision/recall harness
        run: |
          node .scratch/architecture-recovery/research/scripts/14-calibration-harness.mjs \
            --out calibration-out/baseline-report.md \
            --json calibration-out/baseline-summary.json

      - name: Run threshold calibration
        run: |
          node .scratch/architecture-recovery/research/scripts/14-threshold-calibration.mjs \
            --out calibration-out/calibration-report.md

      - name: Assert baseline produced numbers
        run: |
          node -e "const s=require('./calibration-out/baseline-summary.json'); if(!(s.cases>0 && typeof s.precision==='number' && typeof s.recall==='number' && s.gate==='pass')){console.error(JSON.stringify(s));process.exit(1)};console.log('precision='+s.precision,'recall='+s.recall,'f1='+s.f1,'gate='+s.gate)"

      - name: Upload baseline artifacts
        uses: actions/upload-artifact@v4
        with:
          name: calibration-baseline
          path: calibration-out/

      - name: Summary
        if: always()
        run: |
          {
            echo '## Calibration baseline (ticket 14)'
            if [ -f calibration-out/baseline-summary.json ]; then
              node -e "const s=require('./calibration-out/baseline-summary.json');console.log('- corpus cases: '+s.cases);console.log('- precision: '+s.precision+' (TP='+s.TP+', FP='+s.FP+')');console.log('- recall: '+s.recall+' (FN='+s.FN+')');console.log('- f1: '+s.f1);console.log('- regression gate: '+s.gate);console.log('- knownResidual: '+(s.knownResidual.join(', ')||'none'))"
            else
              echo '- harness did not complete; see job log'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
