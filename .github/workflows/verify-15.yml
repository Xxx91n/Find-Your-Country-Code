# 票 15 验证 workflow：引擎门 + 全量 E2E（React 16–19 全 fixture 组），一次 push 全跑。
# 触发：本票验证分支 push（票 10/16 先例：ticket-scoped workflow）或手动 workflow_dispatch。
on:
  workflow_dispatch:
  push:
    branches:
      - 'cch/15-react19-fill-probe'

permissions:
  contents: read

jobs:
  engine-gate:
    name: Engine gate (ticket 15)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Engine gate (verify-ticket-15.mjs)
        run: node .scratch/architecture-recovery/research/scripts/verify-ticket-15.mjs
      - name: Prior gates (09 baseline)
        run: node .scratch/architecture-recovery/research/scripts/verify-ticket-09.mjs

  e2e:
    name: Build + Playwright E2E (full suite)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Build userscript
        run: npm run build
      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium
      - name: E2E (full suite)
        run: npx playwright test
      - name: Upload build artifact as evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dist-userscript-verify-15
          path: dist/find-your-country-code.user.js
