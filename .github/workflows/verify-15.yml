# 票 15 验证 workflow：引擎门（verify-ticket-15.mjs + 票 09 基线 verify-ticket-09.mjs）。
# 全量 E2E 由统一 e2e.yml 承担（票 36 门禁碎片收口，单次全量运行覆盖本票断言）。
# 触发：pull_request（ADR-0006 PR 门控）+ 本票验证分支 push + 手动 workflow_dispatch。
on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - 'cch/15-react19-fill-probe'

permissions:
  contents: read

jobs:
  engine-gate:
    name: Engine gate (ticket 15)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # 票 36（A-014）：装载器需 module.stripTypeScriptTypes（Node >= 22.13）。
          node-version: 22
      - name: Engine gate (verify-ticket-15.mjs)
        run: node tests/scripts/verify-ticket-15.mjs
      - name: Prior gates (09 baseline)
        run: node tests/scripts/verify-ticket-09.mjs
