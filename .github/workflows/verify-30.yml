# 票 30 验证 workflow：rules 引擎门（tests/scripts/verify-ticket-05.mjs，含 S5 分档覆盖收敛断言）
# + typecheck（票 30 类型链自检）。E2E 由统一 e2e.yml 承担（票 36 门禁碎片收口，单次全量运行覆盖本票断言）。
# 触发：本票验证分支 push 或手动 workflow_dispatch（先例：verify-13/15/16/18；PR 门控按 ADR-0006）。
# 装载注记：rules 引擎门复用 14-lib-engine 的 TS-strip 口径（node >= 22.13 的
#   module.stripTypeScriptTypes；cch-23 类型标注后裸 new Function 必红），故全作业钉 node 22。
# 安装面注记：票 43（A-021）安装面根修后，根项目 react@18 与 tests/vendor/react19 workspace 的
#   react@19 分居两个 install root，两侧 peer 各自自洽；lockfile 与 package.json 同步，
#   裸 npm ci 可复现（安装面无需 peer 例外开关）。本票自带安装 + tsc 作业以自证门禁与类型不回退。
on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - 'cch/30-rules-tier-scope-fix'

permissions:
  contents: read

jobs:
  rules-engine-gate:
    name: Rules engine gate (verify-ticket-05.mjs)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Rules engine acceptance gate
        run: node tests/scripts/verify-ticket-05.mjs

  typecheck:
    name: Typecheck (tsc --noEmit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
