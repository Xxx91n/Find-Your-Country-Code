# 票 02 验收门：本票验收门（verify-ticket-02-settings.mjs：深链稳定标识符 / 未新建独立设置视图 /
# 未改 LOCALE_MODES 取值语义与 UI_PREFS_KEY / 字典化全量重渲染 / 菜单 id 原地更新 / 三选一显式控件）。
# 触发：pull_request（ADR-0006 非发版 workflow PR 门控）+ 本票分支 push + 手动 dispatch。
# 纯文本结构断言，无 npm 依赖安装面。
name: Verify Ticket 02 (settings surface)

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - 'cch/02-settings-surface'

permissions:
  contents: read

jobs:
  ticket-02-gate:
    name: Ticket-02 gate (settings surface A-026/A-027)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Ticket-02 acceptance gate
        run: node tests/scripts/verify-ticket-02-settings.mjs
