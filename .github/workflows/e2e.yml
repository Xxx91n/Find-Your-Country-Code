name: E2E

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'cch/**'

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Line-ending guard (CRLF in tracked text)
        run: |
          bad=$(git ls-files | grep -vE '\.(bat|ps1|cmd|png|ico|icns|jpg|jpeg|gif|webp|exe|dll|node|pdb|msi|so|dylib|bin|zip|gz|tar|7z)$' | xargs -r grep -lU "$(printf '\r')" 2>/dev/null || true)
          if [ -n "$bad" ]; then echo "::error::CRLF found in tracked text files: $bad"; exit 1; fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # 联③（票 34 R1）：ERESOLVE 修复——内联 --legacy-peer-deps（Delta「或等效」出口；cch-23 同基线先例）。
      # .npmrc 集中口径为票 31 D-31a 产物（独立分支，未合流前本分支不可见），合流后两口径自然统一。
      # lockfile 由 lockfile-regen workflow 再生（联②，本文件 npm install 不依赖 lockfile 同步）。
      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build userscript
        run: npm run build

      - name: Run E2E
        run: npx playwright test
