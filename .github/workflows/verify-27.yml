# 票 27 验证 workflow：本票验收门（verify-ticket-27.mjs：弱信号复现基线 -> 改后跨线 ->
# 分值单一来源 -> 负例零抬升 -> 阈值不变 -> 全语料指标不回退 -> 命名变体覆盖 -> areacode 护栏）
# + 本票 E2E 作业（弱信号 fixture 规格，tests/weak-signal.spec.ts）。
# 触发：pull_request（ADR-0006 非发版 workflow PR 门控）+ 本票分支 push + 手动 dispatch。
# 门作业 node 钉 22：装载器用 module.stripTypeScriptTypes（>=22.13），无 npm 依赖安装面。
name: Verify Ticket 27 (detection-coverage-floor)

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - 'cch/27-detection-coverage-floor'
      # R1 返工轮：同票返工分支（首轮已合入 main，P8 跨线修复在此分支取证）
      - 'cch/27-detection-coverage-floor-fix'

permissions:
  contents: read

jobs:
  ticket-27-gate:
    name: Ticket-27 gate (weak-signal coverage floor)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Ticket-27 acceptance gate
        run: node tests/scripts/verify-ticket-27.mjs

  # E2E 证据作业（票 27）：只运行本票新增的弱信号 fixture 规格，不改动共享 CI 文件。
  # 票 43（A-021）安装面根修后，React 18 / React 19 分居两个 install root，裸 npm ci 可复现。
  ticket-27-e2e:
    name: Ticket-27 E2E (weak-signal fixture)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build userscript
        run: npm run build

      - name: Run ticket-27 E2E specs
        run: npx playwright test tests/weak-signal.spec.ts
