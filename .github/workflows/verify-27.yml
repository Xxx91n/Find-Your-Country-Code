# 票 27 验证 workflow：本票验收门（verify-ticket-27.mjs：弱信号复现基线 -> 改后跨线 ->
# 分值单一来源 -> 负例零抬升 -> 阈值不变 -> 全语料指标不回退 -> 命名变体覆盖 -> areacode 护栏）
# + 本票 E2E 作业（弱信号 fixture 规格，tests/weak-signal.spec.ts）。
# 触发：pull_request（ADR-0006 非发版 workflow PR 门控）+ 本票分支 push + 手动 dispatch。
# 门作业 node 钉 22：装载器用 module.stripTypeScriptTypes（>=22.13），无 npm 依赖安装面。
name: Verify Ticket 27 (detection-coverage-floor)

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - 'cch/27-detection-coverage-floor'

permissions:
  contents: read

jobs:
  ticket-27-gate:
    name: Ticket-27 gate (weak-signal coverage floor)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Ticket-27 acceptance gate
        run: node tests/scripts/verify-ticket-27.mjs

  # E2E 证据作业（票 27）：共享 .github/workflows/e2e.yml 的 Install dependencies 步骤
  # 在本票栈上仍因 react 18 / react-dom19 别名冲突 ERESOLVE 失败——该内联修复归属 cch/34，
  # 集中 .npmrc 口径归属 cch/31 D-31a，二者均为独立分支，合流前本栈不可见（窗口报告 D-27a）。
  # 本作业在本票自有 workflow 内复刻同一步骤并显式 --legacy-peer-deps，只运行本票新增的
  # 弱信号 fixture 规格，不改动任何共享 CI 文件（避免与 cch/31 / cch/34 产生合并冲突）。
  ticket-27-e2e:
    name: Ticket-27 E2E (weak-signal fixture)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 共享安装面缺陷 D-27a：裸 npm install 遇 ERESOLVE（react-dom19 别名要求 react@^19，
      # 根项目钉 react@^18.3.1）。与 cch/34 内联修复同口径；合流后由 .npmrc 统一，届时本行可删。
      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build userscript
        run: npm run build

      - name: Run ticket-27 E2E specs
        run: npx playwright test tests/weak-signal.spec.ts
