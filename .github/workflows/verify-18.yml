# 票 18 验证 workflow：本票验收门（verify-ticket-18.mjs：两形态评分/否决组/填充断言 + 语料回归动态计数）。
# 引擎门（verify-ticket-02 + misdetect-repro-v2）在 engine-gates.yml 统一跑（票 34 门禁减肥）；
# 全量 E2E 由统一 e2e.yml 承担（票 36 门禁碎片收口，单次全量运行覆盖本票断言）。
# 触发：pull_request（ADR-0006 PR 门控）+ 本票验证分支 push + 手动 workflow_dispatch。
on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - 'cch/18-pseudo-select-e2e'

permissions:
  contents: read

jobs:
  acceptance-gate:
    name: Ticket-18 gate (pseudo-select scoring/fill + corpus)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # 票 36（A-014）：装载器需 module.stripTypeScriptTypes（Node >= 22.13）。
          node-version: 22
      - name: Ticket-18 acceptance gate
        run: node tests/scripts/verify-ticket-18.mjs
