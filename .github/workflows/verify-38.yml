# 票 38（分发最后一公里，A-011）版本一致性闸门
# 断言：tag = package.json（唯一真源）= 产物 @version；并守护 GreasyFork 三条硬规则与分发链接。
# 触发：pull_request（ADR-0006 决策 2：非发版 workflow 必须声明 PR 门控）
#       + 本票分支 push + 手动 workflow_dispatch。
name: Verify Ticket 38 (distribution-last-mile)

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - 'cch/38-distribution-last-mile'

permissions:
  contents: read

jobs:
  ticket-38-gate:
    name: Ticket-38 gate (version consistency + GF hard rules)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build userscript
        run: npm run build

      - name: Ticket-38 version consistency gate
        run: node tests/scripts/38-version-consistency.mjs
