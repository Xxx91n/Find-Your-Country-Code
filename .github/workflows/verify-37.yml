# 票 37 验证 workflow：本票验收门（verify-ticket-37.mjs：GM 菜单第二命令/
#   居中路径保留/i18n 双语键/lowkey 盒内定位与横幅盲区禁令/空目标守卫/判定面零改动）。
# 触发：pull_request（ADR-0006 非发版 workflow PR 门控）+ 本票验证分支 push + 手动 dispatch。
# node 钉 22：装载器用 module.stripTypeScriptTypes（>=22.13），无 npm 依赖安装面。
name: Verify Ticket 37 (entry-point-accessibility)

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - 'cch/37-entry-point-accessibility'

permissions:
  contents: read

jobs:
  ticket-37-gate:
    name: Ticket-37 gate (GM menu entry + lowkey visibility)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Ticket-37 acceptance gate
        run: node tests/scripts/verify-ticket-37.mjs
