# \u7968 42 \u9A8C\u8BC1 workflow\uFF1A\u672C\u7968\u9A8C\u6536\u95E8\uFF08verify-ticket-42.mjs\uFF1A\u8BED\u8A00\u9009\u62E9\u6301\u4E45\u5316 / \u6B7B\u5BFC\u51FA\u6E05\u9664 /
# t() \u5951\u7EA6\u4E0E zh-en \u952E\u96C6\u4E00\u81F4 / \u8BED\u8A00\u504F\u597D\u4E0E\u6536\u85CF\u89C4\u5219\u952E\u89E3\u8026\uFF09\u3002
# \u89E6\u53D1\uFF1Apull_request\uFF08ADR-0006 \u975E\u53D1\u7248 workflow PR \u95E8\u63A7\uFF09+ \u672C\u7968\u9A8C\u8BC1\u5206\u652F push + \u624B\u52A8 dispatch\u3002
# node \u9489 22\uFF1A\u88C5\u8F7D\u5668\u7528 module.stripTypeScriptTypes\uFF08>=22.13\uFF09\uFF0C\u65E0 npm \u4F9D\u8D56\u5B89\u88C5\u9762\u3002
name: Verify Ticket 42 (locale-switch)

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - 'cch/42-locale-switch'

permissions:
  contents: read

jobs:
  ticket-42-gate:
    name: Ticket-42 gate (locale persistence + no dead export)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Ticket-42 acceptance gate
        run: node tests/scripts/verify-ticket-42.mjs
