<!doctype html>
<html><head><meta charset="utf-8"><title>forensics sample: antd Select</title></head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/dayjs@1.11.13/dayjs.min.js"></script>
<script src="https://unpkg.com/antd@5.27.4/dist/antd.min.js"></script>
<script>
(function(){
  window.__fycMeta = { lib: 'antd', cdnVersion: '5.27.4 (UMD)' };
  var COUNTRIES = [{iso2:'US',name:'United States'},{iso2:'GB',name:'United Kingdom'},{iso2:'CA',name:'Canada'},{iso2:'AU',name:'Australia'},{iso2:'DE',name:'Germany'},{iso2:'JP',name:'Japan'}];
  var h = React.createElement;
  var options = COUNTRIES.map(function(c){ return { value: c.iso2, label: c.name }; });
  ReactDOM.createRoot(document.getElementById('root')).render(
    h(antd.Form, { layout: 'vertical', initialValues: { country: 'US' } },
      h(antd.Form.Item, { label: 'Country code', name: 'country' },
        h(antd.Select, { options: options, placeholder: 'Select' }))
    )
  );
})();
</script>
</body></html>
