<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>country semantic: localized native select (ticket 45)</title>
<style>
  form { margin: 16px 0; }
  label { display: block; margin-top: 8px; }
</style>
</head>
<body>
  <h1>本地化国名的原生国家选择器（票 45 形态 a）</h1>

  <!-- #45 (a)：值 ISO2 + **本地化（中文）国名**，同 form 有 tel 主号锚 ⇒ 32 分
       （kw:country 14 + anchor:tel 18）。
       修复前进召唤面：isoName 互证要求选项文本是拉丁字母（/^[A-Za-z\s.'-]+$/），
       CJK 文本直接出局 ⇒ 国家语义谓词不成立。修复后由 countryName 证据（选项文本
       恰为国家名，含本地化名）判 noRegister。
       atomcode 调研（2026-10-29）：CLDR 推荐形态即 value=ISO2 + label=本地化国名，
       真实站点普遍如此（默认英文名需插件补 CLDR 才本地化）。 -->
  <form id="localized-form">
    <label for="country-localized">国家/地区</label>
    <select id="country-localized" name="country">
      <option value="US">美国</option>
      <option value="GB">英国</option>
      <option value="CN">中国大陆</option>
      <option value="JP">日本</option>
      <option value="DE">德国</option>
    </select>

    <label for="localized-tel">手机号</label>
    <input id="localized-tel" type="tel" name="phone">
  </form>

  <!-- 对照：同一页的英文国名原生下拉（F2 形态）。修复前后都应不登记——
       它走的是既有的 isoName 路径，用来锁住「新证据没有改变老形态的结论」。 -->
  <form id="english-form">
    <label for="country-english">Country of residence</label>
    <select id="country-english" name="country">
      <option value="US">United States</option>
      <option value="GB">United Kingdom</option>
      <option value="CN">China</option>
      <option value="JP">Japan</option>
    </select>
    <label for="english-tel">Phone</label>
    <input id="english-tel" type="tel" name="phone">
  </form>

  <!-- 反向护栏：区号证据在场的国家名下拉**必须仍可召唤/注入**——
       国家名证据不得掩盖区号证据（ISA：有 (+NN) 就不是纯国家选择器）。 -->
  <form id="dial-form">
    <label for="country-with-dial">国家区号</label>
    <select id="country-with-dial" name="country_code">
      <option value="US">美国 (+1)</option>
      <option value="GB">英国 (+44)</option>
      <option value="CN">中国大陆 (+86)</option>
    </select>
  </form>
</body>
</html>
