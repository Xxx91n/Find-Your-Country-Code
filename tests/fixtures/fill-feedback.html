<!DOCTYPE html>
<!-- 票 31 · 填充反馈闭环 fixture（hermetic，无外部资源）。
     四字段对应三态信号与格式分歧观测：
       #fb-ok      select 命中 → 真填充成功（对照）
       #fb-nomatch select 无 CN 选项 → 降级复制（当前静默：仅「已复制」提示，字段未写入）
       #fb-diverge 声明约束为纯数字（pattern），但 placeholder 无数字线索 → 推测 plus 写入 '+86'（格式分歧，当前静默）
       #fb-digits  placeholder "86" → 推测 digits 写入 '86'（分歧对照，应为非分歧） -->
<html lang="zh">
<head><meta charset="utf-8"><title>cch 票31 填充反馈 fixture</title></head>
<body>
  <h1>Fill feedback loop (ticket 31)</h1>

  <section>
    <h2>A · select 命中（成功对照）</h2>
    <label for="fb-ok">Country code</label>
    <select id="fb-ok" name="country_code">
      <option value="">请选择</option>
      <option value="+86">+86 中国 China</option>
      <option value="+1">+1 美国 United States</option>
      <option value="+44">+44 英国 United Kingdom</option>
      <option value="+81">+81 日本 Japan</option>
    </select>
  </section>

  <section>
    <h2>B · select 无匹配（降级复制）</h2>
    <label for="fb-nomatch">Country code</label>
    <select id="fb-nomatch" name="country_code">
      <option value="">请选择</option>
      <option value="+1">+1 美国 United States</option>
      <option value="+44">+44 英国 United Kingdom</option>
      <option value="+81">+81 日本 Japan</option>
      <option value="+82">+82 韩国 South Korea</option>
    </select>
  </section>

  <section>
    <h2>C · input 格式分歧（期望 digits 得 plus）</h2>
    <label for="fb-diverge">Country Code</label>
    <input type="text" id="fb-diverge" name="country_code" placeholder="Code" pattern="[0-9]{1,3}">
    <label for="fb-diverge-phone">Phone</label>
    <input type="tel" id="fb-diverge-phone" placeholder="13800138000">
  </section>

  <section>
    <h2>D · input digits 推测（非分歧对照）</h2>
    <label for="fb-digits">Dial Code</label>
    <input type="text" id="fb-digits" name="dial_code" placeholder="86" pattern="[0-9]{1,3}">
    <label for="fb-digits-phone">Phone</label>
    <input type="tel" id="fb-digits-phone" placeholder="13800138000">
  </section>
</body>
</html>
