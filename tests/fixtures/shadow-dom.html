<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Shadow DOM 漏检 fixture</title>
</head>
<body>
<h1>Shadow DOM fixture（open shadow root）</h1>
<p>open shadow root 内的真区号下拉。当前引擎 querySelectorAll 不穿透 → 漏检（用例默认红）；
待票 04（rescan + shadow DOM 穿透）转绿。</p>
<div id="host"></div>
<script>
  const host = document.getElementById('host');
  const root = host.attachShadow({ mode: 'open' });
  root.innerHTML = `
    <label for="shadow-code">国家区号（shadow DOM 内，应注入图标）</label>
    <select id="shadow-code" name="country_code">
      <option value="+86">+86 中国</option>
      <option value="+1">+1 美国</option>
      <option value="+44">+44 英国</option>
      <option value="+81">+81 日本</option>
    </select>
  `;
</script>
</body>
</html>
